name: Managed release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the existing tag. Dispatch without this input only builds.
        type: boolean
        default: false
  push:
    branches:
      - kk-studio
    tags:
      - v*-kk.*

permissions:
  contents: read

concurrency:
  group: managed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: linux-amd64
            os: linux
            arch: amd64
            vscode_target: linux-x64
            npm_arch: x64
          - runner: ubuntu-22.04-arm
            asset: linux-arm64
            os: linux
            arch: arm64
            vscode_target: linux-arm64
            npm_arch: arm64
          - runner: windows-2022
            asset: windows-amd64
            os: windows
            arch: amd64
            vscode_target: win32-x64
            npm_arch: x64
          - runner: macos-15-intel
            asset: macos-amd64
            os: macos
            arch: amd64
            vscode_target: darwin-x64
            npm_arch: x64
          - runner: macos-latest
            asset: macos-arm64
            os: macos
            arch: arm64
            vscode_target: darwin-arm64
            npm_arch: arm64
    env:
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
      VSCODE_ARCH: ${{ matrix.npm_arch }}
      VSCODE_TARGET: ${{ matrix.vscode_target }}
      npm_config_arch: ${{ matrix.npm_arch }}
      npm_config_build_from_source: true
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep repository line endings
        if: matrix.os == 'windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: true

      - name: Resolve the managed release version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=4.141.0-kk.2
          fi
          case "$version" in
            *-kk.*) ;;
            *) echo "managed release version must use the -kk suffix: $version" >&2; exit 1 ;;
          esac
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match v$version" >&2
            exit 1
          fi
          code_server=$(tr -d '[:space:]' < .node-version)
          vscode=$(tr -d '[:space:]' < lib/vscode/.nvmrc)
          case "$code_server" in 24.*) ;; *) echo "code-server Node is not 24: $code_server" >&2; exit 1 ;; esac
          case "$vscode" in 24.*) ;; *) echo "VS Code Node is not 24: $vscode" >&2; exit 1 ;; esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "CODE_SERVER_NODE=$code_server" >> "$GITHUB_ENV"
          echo "VSCODE_NODE=$vscode" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y quilt libkrb5-dev libwebkit2gtk-4.1-0 pkg-config python3 make g++

      - name: Install macOS build dependencies
        if: matrix.os == 'macos'
        run: |
          brew install python-setuptools quilt
          # Kerberos 2.1.1 RTLD names are Linux-only; use its Darwin linker path.
          echo "GYP_DEFINES=kerberos_use_rtld=false" >> "$GITHUB_ENV"

      - name: Apply patches
        run: |
          set -euo pipefail
          if command -v quilt >/dev/null; then
            quilt push -a
          else
            while read -r patch; do
              case "$patch" in '' | '#'*) continue ;; esac
              git apply --whitespace=nowarn "patches/$patch"
            done < patches/series
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/package-lock.json

      - name: Let Windows npm and jq run the build scripts
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          echo "npm_config_script_shell=$(cygpath -w "$(command -v bash)")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/shim"
          cat > "$RUNNER_TEMP/shim/jq" <<'SHIM'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for arg in "$@"; do
            case $arg in
              /dev/fd/* | /proc/*/fd/*)
                copy=$(mktemp)
                cat "$arg" > "$copy"
                args+=("$copy")
                ;;
              *) args+=("$arg") ;;
            esac
          done
          exec jq.exe "${args[@]}"
          SHIM
          chmod +x "$RUNNER_TEMP/shim/jq"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
          sdk=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin"/*/x64 | sort -V | tail -1)
          test -x "$sdk/signtool.exe"
          cygpath -w "$sdk" >> "$GITHUB_PATH"
          MSYS_NO_PATHCONV=1 cmd.exe /c "C:\msys64\usr\bin\pacman -Sy --noconfirm --needed rsync"
          test -x /c/msys64/usr/bin/rsync.exe
          cat > "$RUNNER_TEMP/shim/rsync" <<'SHIM'
          #!/usr/bin/env bash
          exec /c/msys64/usr/bin/rsync.exe "$@"
          SHIM
          chmod +x "$RUNNER_TEMP/shim/rsync"

      - name: Build from source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e 'process.stdout.write("::add-mask::" + Buffer.from(process.env.GITHUB_TOKEN).toString("base64") + "\n")'
          cd lib/vscode/build
          npm ci
          cd ..
          if [[ "$OS" == linux && "$ARCH" == amd64 ]]; then
            source ./build/azure-pipelines/linux/setup-env.sh
          elif [[ "$OS" == linux ]]; then
            # Upstream sysroot compilers run on x86_64, not this native ARM64 host.
            export CC=gcc CXX=g++
            export CXXFLAGS="-std=gnu++20"
            export VSCODE_REMOTE_CC=gcc VSCODE_REMOTE_CXX=g++
            export VSCODE_REMOTE_CXXFLAGS="-std=gnu++20"
          fi
          node build/npm/preinstall.ts
          npm ci
          cd ../..
          npm ci
          node --experimental-strip-types --test test/unit/managed-release.test.ts
          cd lib/vscode
          npm run gulp core-ci
          if [[ "$OS" == linux ]]; then
            ./node_modules/.bin/playwright install --with-deps chromium
            npm run test-browser-no-install -- --build --browser chromium \
              --run out-build/vs/workbench/services/configuration/test/browser/configurationService.test.js \
              --grep "WorkspaceService - first configuration snapshot" \
              --reporter full-json-stream | tee "$RUNNER_TEMP/workspace-snapshot-tests.log"
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import fs from "node:fs";
              const line = fs.readFileSync(process.argv[1], "utf8").split("\n").findLast(line => line.startsWith("[\"end\","));
              assert.ok(line, "workspace snapshot test results are missing");
              const [, stats] = JSON.parse(line);
              assert.ok(stats.tests >= 5, "all workspace snapshot regression cases must run");
              assert.equal(stats.passes, stats.tests);
              assert.equal(stats.failures, 0);
              assert.equal(stats.pending, 0);
            ' "$RUNNER_TEMP/workspace-snapshot-tests.log"
          fi
          cd ../..
          npm run build
          npm run build:vscode
          KEEP_MODULES=1 npm run release
          node --input-type=module -e '
            import { spawnSync } from "node:child_process";
            import { createRequire } from "node:module";
            import fs from "node:fs";
            import path from "node:path";
            const root = process.cwd();
            const release = path.resolve(root, "release");
            const binary = path.resolve(release, "lib", process.env.OS === "windows" ? "node.exe" : "node");
            if (!fs.existsSync(binary)) throw new Error(`bundled Node is missing: ${binary}`);
            const version = spawnSync(binary, ["--version"], { encoding: "utf8" });
            const bundledNode = String(version.stdout).trim();
            if (version.status !== 0 || !bundledNode.startsWith("v24.")) {
              throw new Error(`bundled runtime is not Node 24: ${version.stdout || version.stderr}`);
            }
            const target = `${process.platform}-${process.arch}`;
            // deviceid builds an inert Windows target on Unix; its storage entry
            // point only loads this binding on Windows.
            if (process.platform !== "win32") {
              fs.rmSync(path.join(release, "lib", "vscode", "node_modules", "@vscode", "deviceid", "build", "Release", "windows.node"), { force: true });
            }
            const natives = [];
            const visit = (dir) => {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const child = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name === "prebuilds") continue;
                  visit(child);
                } else if (entry.name.endsWith(".node")) {
                  const parts = child.split(path.sep);
                  const platform = parts.find((part) => /^(darwin|linux|win32|alpine)-/.test(part));
                  if (platform && platform !== target) continue;
                  natives.push(child);
                }
              }
            };
            for (const dir of [path.join(release, "node_modules"), path.join(release, "lib", "vscode", "node_modules"), path.join(release, "lib", "vscode", "extensions")]) visit(dir);
            for (const name of ["pty.node", "spdlog.node"]) if (!natives.some((native) => native.endsWith(name))) throw new Error(`required native module ${name} is missing`);
            const requireServer = createRequire(path.join(release, "lib", "vscode", "package.json"));
            if (typeof requireServer("@vscode/deviceid").getDeviceId !== "function") throw new Error("bundled deviceid storage cannot load");
            const { rgPath } = requireServer("@vscode/ripgrep-universal");
            const ripgrep = spawnSync(rgPath, ["--version"], { encoding: "utf8" });
            if (ripgrep.status !== 0 || !String(ripgrep.stdout).startsWith("ripgrep ")) {
              throw new Error("bundled ripgrep cannot run on this host");
            }
            for (const native of natives) {
              const loaded = spawnSync(binary, ["-e", `require(${JSON.stringify(native)})`], { encoding: "utf8" });
              if (loaded.status !== 0) throw new Error(`native module failed to load: ${native}\n${loaded.stderr}`);
            }
            fs.writeFileSync(path.join(release, "source.json"), JSON.stringify({ bundledNode, os: process.env.OS, arch: process.env.ARCH, target }));
          '
          npm run package

      - name: Record source metadata
        run: |
          set -euo pipefail
          bundled=$(jq -r .bundledNode release/source.json)
          jq -n \
            --arg upstreamTag "v4.141.0" \
            --arg forkCommit "$(git rev-parse HEAD)" \
            --arg submoduleCommit "$(git -C lib/vscode rev-parse HEAD)" \
            --arg buildNode "$CODE_SERVER_NODE" \
            --arg vscodeNode "$VSCODE_NODE" \
            --arg bundledNode "$bundled" \
            --arg os "$OS" \
            --arg arch "$ARCH" \
            '{upstreamTag:$upstreamTag, forkCommit:$forkCommit, submoduleCommit:$submoduleCommit, buildNode:$buildNode, vscodeNode:$vscodeNode, bundledNode:$bundledNode, os:$os, arch:$arch}' \
            > "release-packages/code-server-$VERSION-$OS-$ARCH-source.json"

      - name: Smoke two workspaces in one server
        if: matrix.asset == 'linux-amd64'
        run: |
          set -euo pipefail
          npm --prefix test ci
          ./test/node_modules/.bin/playwright install --with-deps chromium
          CODE_SERVER_TEST_ENTRY="$PWD/release" npm run test:e2e -- --project Chromium --retries 0 e2e/managed-workspaces.test.ts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-server-${{ env.VERSION }}-${{ matrix.asset }}
          path: release-packages/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish || github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: code-server-*
          merge-multiple: true
          path: release-packages
      - name: Publish without replacing an existing release or asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag=$GITHUB_REF_NAME
          else
            tag=v4.141.0-kk.2
          fi
          version=${tag#v}
          repo=$GITHUB_REPOSITORY
          expected=()
          for target in linux-amd64 linux-arm64 windows-amd64 macos-amd64 macos-arm64; do
            expected+=("code-server-$version-$target.tar.gz" "code-server-$version-$target.tar.gz.sha256" "code-server-$version-$target-source.json")
          done
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import fs from "node:fs";
            for (const name of process.argv.slice(1)) {
              if (!name.endsWith(".sha256")) continue;
              const [checksum, file] = fs.readFileSync(`release-packages/${name}`, "utf8").trim().split(/\s+/);
              const actual = createHash("sha256").update(fs.readFileSync(`release-packages/${file}`)).digest("hex");
              if (checksum !== actual) throw new Error(`${file} checksum does not match`);
            }
          ' -- "${expected[@]}"
          for asset in "${expected[@]}"; do
            test -s "release-packages/$asset"
          done
          set +e
          view=$(gh release view "$tag" --repo "$repo" 2>&1)
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "release $tag already exists and will not be replaced" >&2
            exit 1
          fi
          if [[ "$view" != *"(HTTP 404)"* && "$view" != *"release not found"* ]]; then
            echo "could not determine whether release $tag exists: $view" >&2
            exit 1
          fi
          gh release create "$tag" \
            --repo "$repo" \
            --title "$tag" \
            --draft \
            --verify-tag \
            release-packages/*
          gh release edit "$tag" --repo "$repo" --draft=false
